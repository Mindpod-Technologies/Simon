# azure-vm-basic — single Ubuntu VM in Azure running Simon (control-plane managed).
# Immutable once used by a customer — bump the file (azure-vm-basic-v2.yml)
# for changes. The sha of THIS file goes into every receipt.
name: azure-vm-basic
description: Single Ubuntu VM in Azure; Simon runs via Docker Compose; egress-only heartbeat to the control plane
params:
  customer:
    required: true
    pattern: "^[a-z0-9][a-z0-9-]{2,40}$"
    description: Customer slug (DNS-safe)
  region:
    required: true
    pattern: "^[a-z0-9]+$"
    description: Azure region (e.g. eastus)
  vm_size:
    required: true
    pattern: "^Standard_[A-Za-z0-9_]+$"
    description: VM size (e.g. Standard_B2s)
bootstrap:
  # Rendered into cloud-init by the pipeline; {endpoint}/{health_token}
  # are pipeline-generated, never model-generated.
  packages: [docker.io, docker-compose-v2, ufw]
  simon_compose: true
  heartbeat_every_minutes: 15
