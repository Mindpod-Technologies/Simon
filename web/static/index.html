<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMON</title>
<style>
  :root {
    --bg: #06090c;
    --panel: #0b1116;
    --panel-border: #16232b;
    --text: #c9d4d8;
    --text-dim: #5d707a;
    --accent: #3fc6c9;
    --accent-dim: rgba(63, 198, 201, 0.12);
    --accent-glow: rgba(63, 198, 201, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.45em;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
  }
  header .status {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
  }
  header .spacer { flex: 1; }
  #docs-toggle {
    display: none;
    font-size: 11px;
    letter-spacing: 0.15em;
    padding: 6px 12px;
  }
  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
    width: 100%;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 18px 0;
    min-height: 0;
    min-width: 0;
  }
  /* ---- arc reactor orb ---- */
  .orb-wrap {
    display: flex;
    justify-content: center;
    padding: 10px 0 18px;
  }
  .orb {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(63,198,201,0.25) 0%,
      rgba(63,198,201,0.06) 45%,
      transparent 70%);
    border: 1px solid rgba(63,198,201,0.35);
    box-shadow: 0 0 24px var(--accent-dim),
                inset 0 0 24px var(--accent-dim);
    transition: box-shadow 0.4s ease, transform 0.4s ease;
  }
  .orb::before, .orb::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(63,198,201,0.25);
  }
  .orb::after {
    inset: 26px;
    border-color: rgba(63,198,201,0.45);
    background: radial-gradient(circle at 50% 50%,
      rgba(120,225,228,0.5) 0%,
      rgba(63,198,201,0.15) 55%,
      transparent 75%);
  }
  .orb.active {
    animation: orb-pulse 1.4s ease-in-out infinite;
  }
  .orb.active::after {
    animation: core-pulse 1.4s ease-in-out infinite;
  }
  .orb.speaking {
    animation: orb-pulse 0.55s ease-in-out infinite;
  }
  @keyframes orb-pulse {
    0%, 100% { box-shadow: 0 0 22px var(--accent-dim), inset 0 0 22px var(--accent-dim); transform: scale(1); }
    50% { box-shadow: 0 0 48px var(--accent-glow), inset 0 0 40px var(--accent-glow); transform: scale(1.04); }
  }
  @keyframes core-pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  /* ---- transcript ---- */
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) transparent;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fade-in 0.25s ease;
  }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .msg.user {
    align-self: flex-end;
    background: #101b21;
    border: 1px solid var(--panel-border);
    color: var(--text);
  }
  .msg.simon {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid rgba(63,198,201,0.18);
    box-shadow: 0 0 14px rgba(63,198,201,0.05);
  }
  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--panel-border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 12px;
  }
  .msg .who {
    display: block;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .msg.simon .who { color: var(--accent); opacity: 0.7; }
  /* ---- input ---- */
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 0 18px;
    border-top: 1px solid var(--panel-border);
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #input:focus {
    border-color: rgba(63,198,201,0.45);
    box-shadow: 0 0 12px var(--accent-dim);
  }
  button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text-dim);
    font: inherit;
    padding: 0 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    color: var(--accent);
    border-color: rgba(63,198,201,0.45);
    box-shadow: 0 0 12px var(--accent-dim);
  }
  #mic.recording {
    color: #d66;
    border-color: rgba(220,100,100,0.5);
    animation: rec-pulse 1.1s ease-in-out infinite;
  }
  @keyframes rec-pulse {
    0%, 100% { box-shadow: 0 0 6px rgba(220,100,100,0.2); }
    50% { box-shadow: 0 0 18px rgba(220,100,100,0.5); }
  }
  button:disabled { opacity: 0.4; cursor: default; }
  /* ---- documents sidebar ---- */
  #docs-panel {
    width: 270px;
    flex-shrink: 0;
    border-left: 1px solid var(--panel-border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    padding: 16px 14px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) transparent;
  }
  #docs-panel h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  #docs-panel h3 {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  .doc-item {
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    word-break: break-all;
  }
  .doc-item .name { color: var(--text); }
  .doc-item .meta { color: var(--text-dim); font-size: 10px; margin-top: 3px; }
  .doc-item .actions { margin-top: 6px; display: flex; gap: 6px; }
  .doc-item .actions button, .doc-item .actions a {
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 4px 10px;
    text-decoration: none;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text-dim);
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .doc-item .actions button:hover, .doc-item .actions a:hover {
    color: var(--accent);
    border-color: rgba(63,198,201,0.45);
  }
  .docs-empty { color: var(--text-dim); font-size: 11px; }
  .job-status {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 1px 7px;
    border-radius: 4px;
    margin-top: 4px;
  }
  .job-status.pending { color: #c9a43f; border: 1px solid rgba(201,164,63,0.4); }
  .job-status.running { color: var(--accent); border: 1px solid rgba(63,198,201,0.4); animation: rec-pulse 1.6s ease-in-out infinite; }
  .job-status.done { color: #5fb86a; border: 1px solid rgba(95,184,106,0.4); }
  .job-status.failed, .job-status.cancelled { color: #d66; border: 1px solid rgba(220,100,100,0.4); }
  .sched-when { color: var(--accent); font-size: 10px; letter-spacing: 0.1em; }
  #docs-panel.dragover {
    border-left-color: var(--accent);
    box-shadow: inset 0 0 30px var(--accent-dim);
  }
  #drop-hint {
    display: none;
    text-align: center;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.15em;
    padding: 8px 0 2px;
  }
  #docs-panel.dragover #drop-hint { display: block; }
  /* ---- narrow screens: sidebar becomes overlay ---- */
  @media (max-width: 900px) {
    #docs-toggle { display: block; }
    #docs-panel {
      position: fixed;
      top: 49px;
      right: 0;
      bottom: 0;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      box-shadow: -12px 0 30px rgba(0,0,0,0.5);
    }
    #docs-panel.open { transform: translateX(0); }
  }
</style>
</head>
<body>
  <header>
    <h1>SIMON</h1>
    <span class="status" id="status">ONLINE</span>
    <span class="spacer"></span>
    <button id="docs-toggle">DOCUMENTS</button>
    <a href="/settings" style="text-decoration:none"><button>SETTINGS</button></a>
  </header>
  <div class="layout">
    <main>
      <div class="orb-wrap"><div class="orb" id="orb"></div></div>
      <div id="transcript"></div>
      <div class="input-bar">
        <input id="input" type="text" placeholder="How may I assist, sir?"
               autocomplete="off" autofocus>
        <input id="file-input" type="file" style="display:none"
               accept=".pdf,.docx,.txt,.md,.markdown,.csv,.json,.log">
        <button id="attach" title="Upload a document for Simon">&#128206;</button>
        <button id="mic" title="Hold a voice message">&#127908;</button>
        <button id="send">Send</button>
      </div>
    </main>
    <aside id="docs-panel">
      <h2>DOCUMENTS</h2>
      <div id="drop-hint">DROP TO UPLOAD</div>
      <h3>UPLOADED</h3>
      <div id="uploads-list"><span class="docs-empty">Nothing uploaded yet.</span></div>
      <h3>CREATED BY SIMON</h3>
      <div id="docs-list"><span class="docs-empty">Nothing created yet.</span></div>
      <h3>BACKGROUND JOBS</h3>
      <div id="jobs-list"><span class="docs-empty">No jobs yet.</span></div>
      <h3>AUTOMATIONS</h3>
      <div id="schedules-list"><span class="docs-empty">No recurring automations yet.</span></div>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
