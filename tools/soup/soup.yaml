# Simon Work pilot: Mindpod-knowledge fine-tune of Qwen3-8B (MLX, Apple Silicon)
base: mlx-community/Qwen3-8B-4bit
task: sft
backend: mlx

data:
  train: ./data/train.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 1024

training:
  epochs: 3
  lr: 2e-5
  batch_size: 2
  lora:
    r: 32
    alpha: 32
    target_modules: auto

output: ./output
