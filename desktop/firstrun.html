<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simon Work — Setup</title>
<style>
  body { background:#0a0e14; color:#c9d6e3; font:15px/1.6 -apple-system, "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { max-width:560px; padding:40px; }
  h1 { color:#e8f0f7; font-size:26px; margin:0 0 6px; }
  .logo { width:52px; height:52px; border:2px solid #4fd1c5; border-radius:12px; color:#4fd1c5;
          display:flex; align-items:center; justify-content:center; font:700 26px ui-monospace,monospace;
          margin-bottom:22px; }
  code, pre { font-family:ui-monospace, Menlo, Consolas, monospace; }
  pre { background:#0d131c; border:1px solid #1e2a38; border-radius:10px; padding:16px 18px;
        color:#4fd1c5; font-size:14px; overflow-x:auto; }
  .dim { color:#5c7186; font-size:13px; }
  .warn { color:#f6ad55; }
  .go { background:#4fd1c5; color:#0a0e14; border:0; border-radius:8px;
        padding:10px 18px; font-size:14px; cursor:pointer; font-weight:600; }
  .go:disabled { opacity:0.35; cursor:default; }
  ol { padding-left:20px; } li { margin-bottom:10px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">S</div>
  <div id="content"></div>
</div>
<script>
  const state = new URLSearchParams(location.search).get('state') || 'missing';
  const isWin = navigator.platform.startsWith('Win');
  const el = document.getElementById('content');

  if (state === 'starting') {
    el.innerHTML = `
      <h1>Simon is starting…</h1>
      <p class="dim">The local backend is coming up. This takes a few seconds
      (longer the first time, while models load). You'll be taken to Simon
      automatically.</p>`;
    setTimeout(() => location.href = 'http://localhost:8788/', 8000);
  } else if (state === 'failed') {
    el.innerHTML = `
      <h1 class="warn">Simon didn't start</h1>
      <p>The backend at <code>~/simon</code> exists but isn't answering.
      Check the logs and restart it:</p>
      <pre>tail -f ~/simon/data/logs/simon.err.log</pre>
      <p class="dim">Then relaunch Simon Work.</p>`;
  } else {
    el.innerHTML = `
      <h1>Let's hire Simon.</h1>
      <p><strong>Step 1 — the engine.</strong> Simon thinks with local models
      via <b>Ollama</b> (free, private, runs on this machine).</p>
      <p id="ollama-status" class="dim">checking…</p>
      <p><button class="go" id="ollama-btn">Install Ollama for me</button></p>
      <p><strong>Step 2 — Simon himself.</strong> Models, services, web UI —
      one click, ~18 GB of models download once.</p>
      <p><button class="go" id="simon-btn" disabled>Install Simon</button>
      <span class="dim" id="simon-note"> install the engine first</span></p>
      <pre id="log" style="display:none;max-height:180px;overflow-y:auto;color:#8fa8bd"></pre>
      <details class="dim" style="margin-top:14px">
        <summary>prefer the terminal?</summary>
        <pre>${isWin
          ? 'git clone <your-simon-repo> $HOME\\simon\n.\\simon\\deploy\\install_windows.ps1'
          : 'git clone <your-simon-repo> ~/simon\n~/simon/deploy/install_mac.sh'}</pre>
      </details>
      <p class="dim">Requires ${isWin ? 'Windows 10+, 16 GB RAM (24 GB recommended)' :
        'Apple Silicon Mac, 24 GB RAM recommended'}. Simon Work keeps running
      in the system tray when you close this window.</p>`;

    const statusEl = document.getElementById('ollama-status');
    const ollamaBtn = document.getElementById('ollama-btn');
    const simonBtn = document.getElementById('simon-btn');
    const simonNote = document.getElementById('simon-note');
    const logEl = document.getElementById('log');
    const bridge = window.simonDesktop;

    const log = (step, text) => {
      logEl.style.display = 'block';
      logEl.textContent += `[${step}] ${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    };
    if (bridge && bridge.onProgress) bridge.onProgress(({ step, text }) => log(step, text));

    function readyForSimon() {
      statusEl.innerHTML = '<span style="color:#4fd1c5">✓ Ollama is installed and running.</span>';
      ollamaBtn.style.display = 'none';
      simonBtn.disabled = false;
      simonNote.textContent = '';
    }

    async function checkOllama() {
      const up = bridge && bridge.ollamaStatus ? await bridge.ollamaStatus() : false;
      if (up) readyForSimon();
      else statusEl.textContent = 'Ollama not detected yet.';
      return up;
    }

    ollamaBtn.onclick = async () => {
      ollamaBtn.disabled = true;
      log('ollama', 'starting…');
      const res = bridge && bridge.ollamaInstall
        ? await bridge.ollamaInstall()
        : { ok: false, error: 'auto-install unavailable' };
      if (res.ok) { readyForSimon(); }
      else {
        log('ollama', 'failed: ' + res.error);
        ollamaBtn.disabled = false;
        ollamaBtn.textContent = 'Try again (or download manually)';
        if (bridge && bridge.ollamaDownload) bridge.ollamaDownload();
      }
    };

    simonBtn.onclick = async () => {
      simonBtn.disabled = true;
      log('simon', 'starting…');
      const res = await bridge.simonInstall();
      if (res.ok) {
        setTimeout(() => location.href = 'http://localhost:8788/', 2000);
      } else {
        log('simon', 'failed: ' + res.error);
        simonBtn.disabled = false;
        simonBtn.textContent = 'Try again';
      }
    };

    checkOllama();
  }
</script>
</body>
</html>
